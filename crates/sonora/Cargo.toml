[package]
name = "sonora"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# the gpui frame overlay and repaint wash, off in normal builds
profiler = ["gpui/profiler"]
bundled-sqlite = ["state/bundled-sqlite"]

[dependencies]
anyhow.workspace = true
dirs.workspace = true
env_logger.workspace = true
futures.workspace = true
log.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
i18n.workspace = true
icons.workspace = true
music.workspace = true
state.workspace = true
storage.workspace = true
input.workspace = true
router.workspace = true
ui.workspace = true
views.workspace = true
reqwest.workspace = true
rustls.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt"] }
interprocess.workspace = true
image.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
ksni.workspace = true

# The Widevine host's shim is prebuilt for x86_64 linux and compiled from source everywhere
# else, which the linux and macOS release runners can do. Windows waits on a port of the shim's
# dlopen calls, so Apple Music playback is off there.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
music = { workspace = true, features = ["widevine"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tray-icon.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true

[target.'cfg(windows)'.dependencies]
raw-window-handle.workspace = true
resvg.workspace = true
state = { workspace = true, features = ["bundled-sqlite"] }
windows.workspace = true
windows-sys.workspace = true

[dev-dependencies]
# only the apple-login example, which puts up a sign-in window without the app around it
webview.workspace = true

[build-dependencies]
embed.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true
